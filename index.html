<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>榮休感謝卡審閱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap">
<style>
  /* Layout: the card rests on a dark olive table, with the facts for each option beside it. */
  :root {
    --table: #20261a;
    --table-raised: #2c3424;
    --line: #4d583e;
    --cream: #f6efdc;
    --muted: #c7caae;
    --gold: #dcb96f;
    --paper: #fbf6ea;
    --shadow: rgba(8, 10, 5, .55);
    --display: "Noto Serif TC", "Songti TC", PMingLiU, serif;
    --body: "Noto Serif TC", "Songti TC", PMingLiU, serif;
    --ease: cubic-bezier(.5, .05, .15, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--table); color: var(--cream); font-family: var(--body); font-size: 1.0625rem; line-height: 1.7; }
  .page {
    display: grid; gap: 1.5rem; max-width: 1240px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 2rem 3rem;
  }
  .intro { display: grid; gap: .4rem; }
  .eyebrow { margin: 0; color: var(--gold); font-size: .85rem; font-weight: 500; letter-spacing: .06em; }
  h1 { margin: 0; font-family: var(--display); font-size: clamp(1.4rem, 3.4vw, 2.6rem); font-weight: 500; line-height: 1.3; text-wrap: balance; }
  .lede { margin: 0; max-width: 44rem; color: var(--muted); }

  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .tab {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: .1rem .5rem;
    min-height: 3.25rem; padding: .5rem; background: none; border: 0; border-bottom: 3px solid transparent;
    color: var(--muted); font: inherit; cursor: pointer;
  }
  .tab b { color: var(--gold); font-family: var(--display); font-size: 1.4rem; font-weight: 600; }
  .tab:hover { color: var(--cream); }
  .tab[aria-selected="true"] { border-bottom-color: var(--gold); color: var(--cream); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .viewer { display: grid; gap: 1.5rem; align-items: start; }
  @media (min-width: 920px) { .viewer { grid-template-columns: minmax(0, 1fr) 19rem; gap: 2.5rem; } }

  .stage { position: relative; min-width: 0; height: 560px; overflow-x: clip; }
  .option { position: absolute; inset: 0; display: grid; place-items: center; perspective: 2200px; }

  .card3d {
    position: relative; width: var(--leaf-w, 300px); aspect-ratio: 595.5 / 842; max-width: 100%;
    transform: translateX(0) scale(1) rotateY(0deg); transform-style: preserve-3d;
    transition: transform 1.15s var(--ease); cursor: pointer;
  }
  .card3d.is-open { transform: translateX(calc(50% * var(--open-scale, 1))) scale(var(--open-scale, 1)) rotateY(0deg); }
  .card3d.is-back { transform: translateX(0) scale(1) rotateY(180deg); }
  .leaf { position: absolute; inset: 0; transform-style: preserve-3d; }
  .leaf-cover { transform: translateZ(1px) rotateY(0deg); transform-origin: left center; transition: transform 1.15s var(--ease); }
  .is-open .leaf-cover { transform: translateZ(1px) rotateY(-180deg); }
  .card3d.close-first { transition-delay: .55s; }
  .card3d.flip-first .leaf-cover { transition-delay: .55s; }
  .face {
    position: absolute; inset: 0; overflow: hidden; background: var(--paper);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    box-shadow: 0 14px 30px var(--shadow);
  }
  .face-reverse { transform: rotateY(180deg); }
  .face img { position: absolute; top: -1.0095%; width: 202.855%; height: 102.02%; max-width: none; }
  .face img.right-half { left: -101.427%; }
  .face img.left-half { left: -1.427%; }
  .face.fold-left::after, .face.fold-right::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .face.fold-left::after { background: linear-gradient(90deg, rgba(60, 50, 25, .22), transparent 7%); }
  .face.fold-right::after { background: linear-gradient(270deg, rgba(60, 50, 25, .22), transparent 7%); }

  .sheet-wrap { width: var(--sheet-w, 300px); max-width: 100%; filter: drop-shadow(0 14px 22px var(--shadow)); perspective: 2200px; }
  .flip { position: relative; transform: rotateY(0deg); transform-style: preserve-3d; transition: transform 1.15s var(--ease); cursor: pointer; }
  .flip.is-back { transform: rotateY(180deg); }
  .flip .sheet { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .flip .sheet-reverse { position: absolute; inset: 0; transform: rotateY(180deg); }
  .sheet { position: relative; overflow: hidden; background: var(--paper); }
  .sheet img { position: absolute; max-width: none; }
  .sheet-portrait { aspect-ratio: 842 / 1191; }
  .sheet-portrait img { top: -.7137%; left: -1.0095%; width: 102.02%; height: 101.427%; }
  .sheet-landscape { aspect-ratio: 1191 / 842; }
  .sheet-landscape img { top: -1.0095%; left: -.7137%; width: 101.427%; height: 102.02%; }
  .sheet-wrap.play { animation: lift 1.25s cubic-bezier(.2, .8, .2, 1); }
  .sheet-landscape.play { animation: open-around 1.5s var(--ease) .35s backwards; }
  @keyframes lift { from { opacity: .45; transform: translateY(7%) rotateX(16deg) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes open-around { from { clip-path: inset(21.5% 26.5%); } to { clip-path: inset(0); } }
  @keyframes soft-fade { from { opacity: .4; } to { opacity: 1; } }

  .facts { display: grid; gap: 1rem; min-width: 0; }
  h2 { margin: 0; font-family: var(--display); font-size: 1.7rem; font-weight: 600; line-height: 1.3; }
  .summary { margin: 0; color: var(--muted); }
  dl { display: grid; gap: .7rem; margin: 0; padding-block: .9rem; border-block: 1px solid var(--line); }
  dl div { display: grid; gap: .05rem; }
  dt { color: var(--gold); font-size: .78rem; font-weight: 500; letter-spacing: .06em; }
  dd { margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: .6rem; }
  .btn {
    min-height: 2.75rem; padding: .35rem 1.1rem; border: 1px solid var(--gold); border-radius: 2px;
    background: transparent; color: var(--cream); font: inherit; cursor: pointer;
  }
  .btn.primary { background: var(--gold); color: var(--table); font-weight: 500; }
  .btn:hover { background: var(--table-raised); color: var(--cream); }
  .feedback { margin: 0; padding: 1rem 1.2rem; background: var(--table-raised); }

  @media (prefers-reduced-motion: reduce) {
    .card3d, .leaf-cover, .flip { transition: none; }
    .sheet-wrap.play, .sheet-landscape.play { animation: soft-fade .3s ease; }
  }
</style>

</head>
<body>
<main class="page">
  <header class="intro">
    <p class="eyebrow">致牧師的榮休感謝卡</p>
    <h1>我們該印製哪一款榮休感謝卡？</h1>
    <p class="lede">這裡有三款 A3 版面，插圖和文字內容相同。</p>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="卡片版面">
    <button class="tab" id="tab-folded" role="tab" aria-controls="viewer" aria-selected="true" type="button"><b>A</b> <span>摺疊</span></button>
    <button class="tab" id="tab-portrait" role="tab" aria-controls="viewer" aria-selected="false" tabindex="-1" type="button"><b>B</b> <span>直式</span></button>
    <button class="tab" id="tab-landscape" role="tab" aria-controls="viewer" aria-selected="false" tabindex="-1" type="button"><b>C</b> <span>橫式</span></button>
  </div>

  <section class="viewer" id="viewer" role="tabpanel" aria-labelledby="tab-folded">
    <div class="stage" id="stage">
      <div class="option" id="view-folded">
        <div class="card3d" id="card">
          <div class="leaf">
            <div class="face fold-left"><img class="right-half" src="images/zh/a-inside.jpg" alt="摺疊卡內頁右側，為空白簽名區。"></div>
            <div class="face face-reverse"><img class="left-half" src="images/zh/a-outside.jpg" alt="摺疊卡背面，有一小段橄欖枝和獻辭。"></div>
          </div>
          <div class="leaf leaf-cover">
            <div class="face"><img class="right-half" src="images/zh/a-outside.jpg" alt="卡片封面，橄欖花環圍繞著「感謝您」三字，下方是牧師的稱呼。"></div>
            <div class="face face-reverse fold-right"><img class="left-half" src="images/zh/a-inside.jpg" alt="摺疊卡內頁左側，有感謝語、聖經金句和簽名區。"></div>
          </div>
        </div>
      </div>
      <div class="option" id="view-portrait" hidden>
        <div class="sheet-wrap" id="portrait-wrap">
          <div class="flip" id="flip-portrait">
            <div class="sheet sheet-portrait"><img src="images/zh/b-portrait.jpg" alt="直式 A3 卡片，上方是感謝語，下方是大片簽名區。"></div>
            <div class="sheet sheet-portrait sheet-reverse"><img src="images/zh/b-portrait-back.jpg" alt="直式卡片背面，有橄欖花環、十字架、民數記 6:24–26 的祝福和獻辭。"></div>
          </div>
        </div>
      </div>
      <div class="option" id="view-landscape" hidden>
        <div class="sheet-wrap">
          <div class="flip" id="flip-landscape">
            <div class="sheet sheet-landscape" id="landscape-sheet"><img src="images/zh/c-landscape.jpg" alt="橫式 A3 卡片，中央是感謝語，四周是簽名空間。"></div>
            <div class="sheet sheet-landscape sheet-reverse"><img src="images/zh/c-landscape-back.jpg" alt="橫式卡片背面，左邊是橄欖花環和十字架，右邊是民數記 6:24–26 的祝福和獻辭。"></div>
          </div>
        </div>
      </div>
    </div>

    <aside class="facts" aria-live="polite">
      <h2 id="fact-title">摺疊卡</h2>
      <p class="summary" id="fact-summary">將 A3 紙對摺，打開方式就像傳統賀卡，簽名都保存在卡內。</p>
      <dl>
        <div><dt>完成尺寸</dt><dd id="fact-size">合上時 A4，打開時 A3</dd></div>
        <div><dt>80 人的簽名空間</dt><dd id="fact-space">每人 8.4 平方厘米</dd></div>
        <div><dt>最適合</dt><dd id="fact-good">讓牧師隨時打開重溫的紀念品</dd></div>
        <div><dt>請留意</dt><dd id="fact-mind">卡片合上時看不到簽名</dd></div>
      </dl>
      <div class="controls">
        <button class="btn primary" id="btn-open" type="button">打開卡片</button>
        <button class="btn" id="btn-flip" type="button">查看背面</button>
      </div>
    </aside>
  </section>

  <p class="feedback">請告訴傳送此連結給您的人，您喜歡哪一款版面，以及有甚麼想修改的地方。</p>
</main>

<script>
  const OPTIONS = {
    folded: { ratio: 842 / 595.5, title: '摺疊卡', summary: '將 A3 紙對摺，打開方式就像傳統賀卡，簽名都保存在卡內。', size: '合上時 A4，打開時 A3', space: '每人 8.4 平方厘米', good: '讓牧師隨時打開重溫的紀念品', mind: '卡片合上時看不到簽名' },
    portrait: { ratio: 1191 / 842, title: '直式平面', summary: '一張直放的 A3 紙，感謝語在上方，簽名在下方，背面印有祝福經文。', size: 'A3 直式，雙面印刷', space: '每人 8.1 平方厘米', good: '裝裱後掛在牆上', mind: '三款之中簽名空間最少' },
    landscape: { ratio: 842 / 1191, title: '橫式平面', summary: '一張橫放的 A3 紙，感謝語在中央，簽名環繞四周，背面印有祝福經文。', size: 'A3 橫式，雙面印刷', space: '每人 8.7 平方厘米', good: '多人同時圍著桌子簽名', mind: '簽名方向可能各不相同' }
  };
  const LABELS = { open: '打開卡片', close: '合上卡片', back: '查看背面', front: '查看正面' };
  const NEXT_CARD_STATE = { front: 'open', open: 'back', back: 'front' };
  const ids = Object.keys(OPTIONS);
  const $ = id => document.getElementById(id);
  const stage = $('stage'), card = $('card'), openBtn = $('btn-open'), flipBtn = $('btn-flip');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = 'folded', isOpen = false, isBack = false, autoOpen = null, lastWidth = 0;

  function renderFacts() {
    const o = OPTIONS[current];
    $('fact-title').textContent = o.title;
    $('fact-summary').textContent = o.summary;
    $('fact-size').textContent = o.size;
    $('fact-space').textContent = o.space;
    $('fact-good').textContent = o.good;
    $('fact-mind').textContent = o.mind;
  }

  function layout() {
    const width = Math.max(stage.clientWidth - 8, 240);
    const stageTop = stage.getBoundingClientRect().top + window.scrollY;
    const maxHeight = Math.max(420, Math.min(window.innerHeight - stageTop - 28, 800));
    const ratio = OPTIONS[current].ratio;
    const fitted = Math.min(width, maxHeight / ratio);
    if (current === 'folded') {
      stage.style.setProperty('--leaf-w', fitted + 'px');
      stage.style.setProperty('--open-scale', Math.min(width / 2, fitted) / fitted);
    } else {
      stage.style.setProperty('--sheet-w', fitted + 'px');
    }
    stage.style.height = Math.ceil(fitted * ratio + 28) + 'px';
  }

  function syncCard() {
    card.classList.toggle('is-open', isOpen);
    card.classList.toggle('is-back', current === 'folded' && isBack);
    ['portrait', 'landscape'].forEach(name => $('flip-' + name).classList.toggle('is-back', current === name && isBack));
    openBtn.textContent = isOpen ? LABELS.close : LABELS.open;
    flipBtn.textContent = isBack ? LABELS.front : LABELS.back;
  }

  function cardState() { return isOpen ? 'open' : isBack ? 'back' : 'front'; }

  function moveTo(next) {
    const from = cardState();
    card.classList.toggle('close-first', from === 'open' && next === 'back');
    card.classList.toggle('flip-first', from === 'back' && next === 'open');
    isOpen = next === 'open';
    isBack = next === 'back';
    syncCard();
  }

  function cancelAutoOpen() { clearTimeout(autoOpen); autoOpen = null; }

  function play() {
    cancelAutoOpen();
    moveTo('front');
    if (current === 'folded') {
      if (!reduced) autoOpen = setTimeout(() => moveTo('open'), 1000);
      return;
    }
    const el = current === 'portrait' ? $('portrait-wrap') : $('landscape-sheet');
    el.classList.remove('play');
    void el.offsetWidth;
    el.classList.add('play');
  }

  function select(id, focusTab) {
    current = id;
    ids.forEach(name => {
      const tab = $('tab-' + name), active = name === id;
      tab.setAttribute('aria-selected', active);
      tab.tabIndex = active ? 0 : -1;
      $('view-' + name).hidden = !active;
    });
    $('viewer').setAttribute('aria-labelledby', 'tab-' + id);
    if (focusTab) $('tab-' + id).focus();
    renderFacts();
    openBtn.hidden = id !== 'folded';
    layout();
    play();
  }

  ids.forEach((name, i) => {
    const tab = $('tab-' + name);
    tab.addEventListener('click', () => { location.hash = name; if (current !== name) select(name); });
    tab.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const next = ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
      location.hash = next;
      select(next, true);
    });
  });
  card.addEventListener('click', () => {
    cancelAutoOpen();
    moveTo(NEXT_CARD_STATE[cardState()]);
  });
  openBtn.addEventListener('click', () => { cancelAutoOpen(); moveTo(isOpen ? 'front' : 'open'); });
  flipBtn.addEventListener('click', () => { cancelAutoOpen(); moveTo(isBack ? 'front' : 'back'); });
  ['portrait', 'landscape'].forEach(name => $('flip-' + name).addEventListener('click', () => moveTo(isBack ? 'front' : 'back')));
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (OPTIONS[id] && id !== current) select(id);
  });
  new ResizeObserver(() => {
    if (stage.clientWidth !== lastWidth) { lastWidth = stage.clientWidth; layout(); }
  }).observe(stage);
  window.addEventListener('resize', layout);

  const start = location.hash.slice(1);
  select(OPTIONS[start] ? start : 'folded');
</script>
</body>
</html>
